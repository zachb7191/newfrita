<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Frita Batidos — Admin</title>
  <link rel="icon" href="/assets/flower.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <div class="app">
    <div class="scrim" id="scrim"></div>

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark"><img src="/assets/flower.png" alt=""></span>
        <span class="brand-text">
          <strong>Frita Batidos</strong>
          <span>Site Admin</span>
        </span>
        <button class="icon-btn sidebar-close" id="sidebar-close" type="button" aria-label="Close menu"></button>
      </div>
      <nav id="panel-nav" aria-label="Admin sections"></nav>
      <div class="sidebar-foot">
        <a href="/" target="_blank" rel="noopener" id="view-site-link">
          <span class="foot-icon"></span> View live site
        </a>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open menu"></button>
        <div class="crumb">
          <h1 id="panel-title">Loading…</h1>
          <p id="panel-desc"></p>
        </div>
        <div class="topbar-actions">
          <button class="ghost-btn" id="preview-toggle" type="button" title="Toggle live preview"></button>
          <a class="ghost-btn" id="preview-link" href="/" target="_blank" rel="noopener" title="Open page in new tab"></a>
          <button class="save-btn" id="save" type="button" disabled>
            <span class="save-icon"></span><span class="save-label">Saved</span>
          </button>
        </div>
      </header>

      <div class="workspace" id="workspace">
        <div class="panel-scroll">
          <div id="panel-body" class="panel-body"></div>
        </div>
        <aside class="preview" id="preview-pane" hidden>
          <div class="preview-bar">
            <span class="preview-title">Live preview</span>
            <div class="preview-tools">
              <button class="seg-btn active" id="dev-desktop" type="button" title="Desktop width"></button>
              <button class="seg-btn" id="dev-mobile" type="button" title="Phone width"></button>
              <button class="icon-btn" id="preview-refresh" type="button" title="Refresh preview"></button>
            </div>
          </div>
          <div class="preview-stage" id="preview-stage">
            <iframe id="preview-frame" title="Site preview"></iframe>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/admin.js"></script>
</body>
</html>
